<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Airembr &middot; Local Embedder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root { color-scheme: dark; }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #05010f;
        }
        #root {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        canvas.embedding-canvas {
            position: absolute;
            inset: 0;
            display: block;
        }
        .overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            user-select: none;
        }
        .wordmark-logo {
            width: clamp(280px, 42vw, 620px);
            height: auto;
            filter:
                drop-shadow(0 0 18px rgba(255, 255, 255, 0.55))
                drop-shadow(0 0 60px rgba(168, 92, 255, 0.55))
                drop-shadow(0 0 130px rgba(255, 70, 170, 0.35));
        }
        .subtitle {
            margin-top: clamp(-3.5rem, -4vw, -1.5rem);
            font-family: 'Inter', system-ui, sans-serif;
            font-weight: 500;
            font-size: clamp(0.7rem, 1.6vw, 0.95rem);
            letter-spacing: 0.2em;
            color: rgba(230, 220, 255, 0.65);
            text-shadow: 0 0 20px rgba(150, 100, 255, 0.4);
        }
        .vignette {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(ellipse at center, rgba(5, 1, 15, 0) 40%, rgba(5, 1, 15, 0.85) 100%);
        }
    </style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script type="text/babel" data-presets="react">
const { useEffect, useRef } = React;

// Palette echoing the reference art: teal/cyan, violet, magenta, warm amber.
const CLUSTERS = [
    { center: new THREE.Vector3(-14, 9, -4), color: new THREE.Color(0x3df2c0), spread: 11 },
    { center: new THREE.Vector3(15, 8, -6), color: new THREE.Color(0xff4fb0), spread: 13 },
    { center: new THREE.Vector3(-6, -8, 2), color: new THREE.Color(0x8a5bff), spread: 12 },
    { center: new THREE.Vector3(9, -9, 4), color: new THREE.Color(0xc051ff), spread: 12 },
    { center: new THREE.Vector3(0, 1, 6), color: new THREE.Color(0xffb066), spread: 16 },
];

function gaussianJitter(spread) {
    // sum of uniforms approximates a normal distribution, cheap and dependency-free
    return (Math.random() + Math.random() + Math.random() - 1.5) / 1.5 * spread;
}

function buildDust(count) {
    const positions = new Float32Array(count * 3);
    const colors = new Float32Array(count * 3);
    const randoms = new Float32Array(count);
    const sizes = new Float32Array(count);

    for (let i = 0; i < count; i++) {
        const cluster = CLUSTERS[(Math.random() * CLUSTERS.length) | 0];
        const x = cluster.center.x + gaussianJitter(cluster.spread);
        const y = cluster.center.y + gaussianJitter(cluster.spread);
        const z = cluster.center.z + gaussianJitter(cluster.spread * 0.8);

        positions[i * 3] = x;
        positions[i * 3 + 1] = y;
        positions[i * 3 + 2] = z;

        const shimmer = 0.75 + Math.random() * 0.5;
        colors[i * 3] = cluster.color.r * shimmer;
        colors[i * 3 + 1] = cluster.color.g * shimmer;
        colors[i * 3 + 2] = cluster.color.b * shimmer;

        randoms[i] = Math.random() * Math.PI * 2;
        sizes[i] = Math.random() * 1.6 + 0.5;
    }

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute("aColor", new THREE.BufferAttribute(colors, 3));
    geometry.setAttribute("aRandom", new THREE.BufferAttribute(randoms, 1));
    geometry.setAttribute("aSize", new THREE.BufferAttribute(sizes, 1));
    return geometry;
}

function buildHubs(count) {
    const positions = new Float32Array(count * 3);
    const colors = new Float32Array(count * 3);
    const randoms = new Float32Array(count);
    const sizes = new Float32Array(count);
    const pts = [];

    for (let i = 0; i < count; i++) {
        const cluster = CLUSTERS[(Math.random() * CLUSTERS.length) | 0];
        const x = cluster.center.x + gaussianJitter(cluster.spread * 0.7);
        const y = cluster.center.y + gaussianJitter(cluster.spread * 0.7);
        const z = cluster.center.z + gaussianJitter(cluster.spread * 0.6);
        pts.push(new THREE.Vector3(x, y, z));

        positions[i * 3] = x;
        positions[i * 3 + 1] = y;
        positions[i * 3 + 2] = z;

        colors[i * 3] = cluster.color.r;
        colors[i * 3 + 1] = cluster.color.g;
        colors[i * 3 + 2] = cluster.color.b;

        randoms[i] = Math.random() * Math.PI * 2;
        sizes[i] = Math.random() * 3 + 3.5;
    }

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute("aColor", new THREE.BufferAttribute(colors, 3));
    geometry.setAttribute("aRandom", new THREE.BufferAttribute(randoms, 1));
    geometry.setAttribute("aSize", new THREE.BufferAttribute(sizes, 1));
    return { geometry, points: pts, colorsArr: colors };
}

function buildLinks(points, colorsArr, maxDist, maxLinksPerNode) {
    const positions = [];
    const colors = [];

    for (let i = 0; i < points.length; i++) {
        let links = 0;
        for (let j = i + 1; j < points.length && links < maxLinksPerNode; j++) {
            const d = points[i].distanceTo(points[j]);
            if (d < maxDist) {
                positions.push(points[i].x, points[i].y, points[i].z);
                positions.push(points[j].x, points[j].y, points[j].z);
                colors.push(colorsArr[i * 3], colorsArr[i * 3 + 1], colorsArr[i * 3 + 2]);
                colors.push(colorsArr[j * 3], colorsArr[j * 3 + 1], colorsArr[j * 3 + 2]);
                links++;
            }
        }
    }

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute("position", new THREE.BufferAttribute(new Float32Array(positions), 3));
    geometry.setAttribute("color", new THREE.BufferAttribute(new Float32Array(colors), 3));
    return geometry;
}

const POINT_VERTEX_SHADER = `
    attribute float aRandom;
    attribute float aSize;
    attribute vec3 aColor;
    varying vec3 vColor;
    uniform float uTime;
    uniform float uPixelRatio;
    void main() {
        vColor = aColor;
        vec3 pos = position;
        pos.x += sin(uTime * 0.4 + aRandom * 6.2831) * 0.6;
        pos.y += cos(uTime * 0.35 + aRandom * 6.2831) * 0.6;
        pos.z += sin(uTime * 0.3 + aRandom * 3.14159) * 0.5;
        vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
        float pulse = 0.8 + 0.35 * sin(uTime * 1.6 + aRandom * 6.2831);
        gl_PointSize = aSize * pulse * uPixelRatio * (220.0 / -mvPosition.z);
        gl_Position = projectionMatrix * mvPosition;
    }
`;

const POINT_FRAGMENT_SHADER = `
    varying vec3 vColor;
    void main() {
        vec2 uv = gl_PointCoord - vec2(0.5);
        float d = length(uv);
        float alpha = smoothstep(0.5, 0.0, d);
        alpha *= alpha;
        gl_FragColor = vec4(vColor, alpha);
    }
`;

function makePointMaterial() {
    return new THREE.ShaderMaterial({
        uniforms: {
            uTime: { value: 0 },
            uPixelRatio: { value: Math.min(window.devicePixelRatio || 1, 2) },
        },
        vertexShader: POINT_VERTEX_SHADER,
        fragmentShader: POINT_FRAGMENT_SHADER,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        vertexColors: false,
    });
}

function EmbeddingField() {
    const mountRef = useRef(null);

    useEffect(() => {
        const container = mountRef.current;
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x05010f, 0.012);

        const camera = new THREE.PerspectiveCamera(
            55, window.innerWidth / window.innerHeight, 0.1, 500
        );
        camera.position.set(0, 0, 42);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x05010f, 1);
        renderer.domElement.classList.add("embedding-canvas");
        container.appendChild(renderer.domElement);

        const group = new THREE.Group();
        scene.add(group);

        const dustGeometry = buildDust(3200);
        const dustMaterial = makePointMaterial();
        const dust = new THREE.Points(dustGeometry, dustMaterial);
        group.add(dust);

        const hubData = buildHubs(70);
        const hubMaterial = makePointMaterial();
        const hubs = new THREE.Points(hubData.geometry, hubMaterial);
        group.add(hubs);

        const linkGeometry = buildLinks(hubData.points, hubData.colorsArr, 13, 4);
        const linkMaterial = new THREE.LineBasicMaterial({
            vertexColors: true,
            transparent: true,
            opacity: 0.22,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
        });
        const links = new THREE.LineSegments(linkGeometry, linkMaterial);
        group.add(links);

        const pointer = { x: 0, y: 0 };
        const onPointerMove = (e) => {
            pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
            pointer.y = (e.clientY / window.innerHeight) * 2 - 1;
        };
        window.addEventListener("pointermove", onPointerMove);

        const onResize = () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        };
        window.addEventListener("resize", onResize);

        const clock = new THREE.Clock();
        let rafId;
        const animate = () => {
            const t = clock.getElapsedTime();
            dustMaterial.uniforms.uTime.value = t;
            hubMaterial.uniforms.uTime.value = t;

            group.rotation.y = t * 0.035;
            group.rotation.x = Math.sin(t * 0.08) * 0.06;

            camera.position.x += (pointer.x * 6 - camera.position.x) * 0.02;
            camera.position.y += (-pointer.y * 4 - camera.position.y) * 0.02;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
            rafId = requestAnimationFrame(animate);
        };
        animate();

        return () => {
            cancelAnimationFrame(rafId);
            window.removeEventListener("resize", onResize);
            window.removeEventListener("pointermove", onPointerMove);
            container.removeChild(renderer.domElement);
            dustGeometry.dispose();
            hubData.geometry.dispose();
            linkGeometry.dispose();
            dustMaterial.dispose();
            hubMaterial.dispose();
            linkMaterial.dispose();
            renderer.dispose();
        };
    }, []);

    return <div ref={mountRef} style={{ position: "absolute", inset: 0 }} />;
}

function App() {
    return (
        <React.Fragment>
            <EmbeddingField />
            <div className="vignette" />
            <div className="overlay">
                <img className="wordmark-logo" src="/static/airembr.png" alt="a&middot;rembr" />
                <div className="subtitle">Local Embedder API</div>
            </div>
        </React.Fragment>
    );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
