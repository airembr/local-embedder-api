<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Airembr &middot; Local Embedder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root { color-scheme: dark; }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #05010f;
        }
        #root {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        canvas.embedding-canvas {
            position: absolute;
            inset: 0;
            display: block;
        }
        .overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            user-select: none;
        }
        .wordmark-logo {
            width: clamp(280px, 42vw, 620px);
            height: auto;
            filter:
                drop-shadow(0 0 18px rgba(255, 255, 255, 0.55))
                drop-shadow(0 0 60px rgba(168, 92, 255, 0.55))
                drop-shadow(0 0 130px rgba(255, 70, 170, 0.35));
        }
        .subtitle {
            margin-top: clamp(-3.5rem, -4vw, -1.5rem);
            font-family: 'Inter', system-ui, sans-serif;
            font-weight: 500;
            font-size: clamp(0.7rem, 1.6vw, 0.95rem);
            letter-spacing: 0.2em;
            color: rgba(230, 220, 255, 0.65);
            text-shadow: 0 0 20px rgba(150, 100, 255, 0.4);
        }
        .vignette {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(ellipse at center, rgba(5, 1, 15, 0) 40%, rgba(5, 1, 15, 0.85) 100%);
        }
    </style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script type="text/babel" data-presets="react">
const { useEffect, useRef } = React;

// Palette echoing the reference art: teal/cyan, violet, magenta, warm amber.
const CLUSTERS = [
    { center: new THREE.Vector3(-14, 9, -4), color: new THREE.Color(0x3df2c0), spread: 11 },
    { center: new THREE.Vector3(15, 8, -6), color: new THREE.Color(0xff4fb0), spread: 13 },
    { center: new THREE.Vector3(-6, -8, 2), color: new THREE.Color(0x8a5bff), spread: 12 },
    { center: new THREE.Vector3(9, -9, 4), color: new THREE.Color(0xc051ff), spread: 12 },
    { center: new THREE.Vector3(0, 1, 6), color: new THREE.Color(0xffb066), spread: 16 },
];

// A second formation each cluster morphs into: same clusters (same color,
// same spread/shape, same per-point jitter), just rigidly rotated + flipped
// to a different arrangement in space, so every cluster stays tightly formed
// throughout the morph instead of ever passing through a diffuse/random state.
const CLUSTER_B_ROTATION = (137 * Math.PI) / 180;
function rotateClusterCenterB(center) {
    const cosA = Math.cos(CLUSTER_B_ROTATION);
    const sinA = Math.sin(CLUSTER_B_ROTATION);
    return new THREE.Vector3(
        center.x * cosA - center.z * sinA,
        -center.y,
        center.x * sinA + center.z * cosA
    );
}
const CLUSTER_CENTERS_B = CLUSTERS.map((c) => rotateClusterCenterB(c.center));

// Shared "morphing" schedule: hold formation A, morph to formation B over
// TRANSITION_SECONDS, hold B, morph back — then repeat. Baked into the shaders
// as constants (via template literals) and mirrored in JS (for the link
// endpoints below) so everything stays in lockstep.
const HOLD_SECONDS = 60.0;
const TRANSITION_SECONDS = 8.0;
const FORM_CYCLE = 2 * (HOLD_SECONDS + TRANSITION_SECONDS);
const DUST_PHASE = 0.0;
const HUB_PHASE = 4.0;

function gaussianJitter(spread) {
    // sum of uniforms approximates a normal distribution, cheap and dependency-free
    return (Math.random() + Math.random() + Math.random() - 1.5) / 1.5 * spread;
}

function smoothstep01(x) {
    x = Math.min(1, Math.max(0, x));
    return x * x * (3 - 2 * x);
}

function formProgress(t, phase) {
    const local = ((t + phase) % FORM_CYCLE + FORM_CYCLE) % FORM_CYCLE;
    if (local < HOLD_SECONDS) {
        return 1; // holding formation A
    }
    if (local < HOLD_SECONDS + TRANSITION_SECONDS) {
        return 1 - smoothstep01((local - HOLD_SECONDS) / TRANSITION_SECONDS);
    }
    if (local < HOLD_SECONDS * 2 + TRANSITION_SECONDS) {
        return 0; // holding formation B
    }
    return smoothstep01((local - (HOLD_SECONDS * 2 + TRANSITION_SECONDS)) / TRANSITION_SECONDS);
}

function hubCurrentPosition(hubData, i, t, out) {
    const progress = formProgress(t, HUB_PHASE);
    const clusterBPos = hubData.clusterB[i];
    const clusterPos = hubData.points[i];
    const rnd = hubData.randoms[i];
    out.x = clusterBPos.x + (clusterPos.x - clusterBPos.x) * progress;
    out.y = clusterBPos.y + (clusterPos.y - clusterBPos.y) * progress;
    out.z = clusterBPos.z + (clusterPos.z - clusterBPos.z) * progress;
    // mirrors the shimmer term in buildPointVertexShader() so the hub dots
    // (rendered on the GPU) and the link endpoints (computed here) match.
    out.x += Math.sin(t * 0.4 + rnd * Math.PI * 2) * 0.6;
    out.y += Math.cos(t * 0.35 + rnd * Math.PI * 2) * 0.6;
    out.z += Math.sin(t * 0.3 + rnd * Math.PI) * 0.5;
    return out;
}

function buildDust(count) {
    const positions = new Float32Array(count * 3);
    const clusterB = new Float32Array(count * 3);
    const colors = new Float32Array(count * 3);
    const randoms = new Float32Array(count);
    const sizes = new Float32Array(count);

    for (let i = 0; i < count; i++) {
        const ci = (Math.random() * CLUSTERS.length) | 0;
        const cluster = CLUSTERS[ci];
        const dx = gaussianJitter(cluster.spread);
        const dy = gaussianJitter(cluster.spread);
        const dz = gaussianJitter(cluster.spread * 0.8);

        positions[i * 3] = cluster.center.x + dx;
        positions[i * 3 + 1] = cluster.center.y + dy;
        positions[i * 3 + 2] = cluster.center.z + dz;

        // same relative jitter applied to the B-formation center, so this
        // cluster rigidly relocates/rotates rather than re-randomizing.
        const centerB = CLUSTER_CENTERS_B[ci];
        clusterB[i * 3] = centerB.x + dx;
        clusterB[i * 3 + 1] = centerB.y + dy;
        clusterB[i * 3 + 2] = centerB.z + dz;

        const shimmer = 0.75 + Math.random() * 0.5;
        colors[i * 3] = cluster.color.r * shimmer;
        colors[i * 3 + 1] = cluster.color.g * shimmer;
        colors[i * 3 + 2] = cluster.color.b * shimmer;

        randoms[i] = Math.random() * Math.PI * 2;
        sizes[i] = Math.random() * 1.6 + 0.5;
    }

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute("aClusterB", new THREE.BufferAttribute(clusterB, 3));
    geometry.setAttribute("aColor", new THREE.BufferAttribute(colors, 3));
    geometry.setAttribute("aRandom", new THREE.BufferAttribute(randoms, 1));
    geometry.setAttribute("aSize", new THREE.BufferAttribute(sizes, 1));
    return geometry;
}

function buildHubs(count) {
    const positions = new Float32Array(count * 3);
    const clusterB = new Float32Array(count * 3);
    const colors = new Float32Array(count * 3);
    const randoms = new Float32Array(count);
    const sizes = new Float32Array(count);
    const pts = [];
    const clusterBPts = [];

    for (let i = 0; i < count; i++) {
        const ci = (Math.random() * CLUSTERS.length) | 0;
        const cluster = CLUSTERS[ci];
        const dx = gaussianJitter(cluster.spread * 0.7);
        const dy = gaussianJitter(cluster.spread * 0.7);
        const dz = gaussianJitter(cluster.spread * 0.6);
        const x = cluster.center.x + dx;
        const y = cluster.center.y + dy;
        const z = cluster.center.z + dz;
        pts.push(new THREE.Vector3(x, y, z));

        positions[i * 3] = x;
        positions[i * 3 + 1] = y;
        positions[i * 3 + 2] = z;

        const centerB = CLUSTER_CENTERS_B[ci];
        const bPos = new THREE.Vector3(centerB.x + dx, centerB.y + dy, centerB.z + dz);
        clusterBPts.push(bPos);
        clusterB[i * 3] = bPos.x;
        clusterB[i * 3 + 1] = bPos.y;
        clusterB[i * 3 + 2] = bPos.z;

        colors[i * 3] = cluster.color.r;
        colors[i * 3 + 1] = cluster.color.g;
        colors[i * 3 + 2] = cluster.color.b;

        randoms[i] = Math.random() * Math.PI * 2;
        sizes[i] = Math.random() * 3 + 3.5;
    }

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute("aClusterB", new THREE.BufferAttribute(clusterB, 3));
    geometry.setAttribute("aColor", new THREE.BufferAttribute(colors, 3));
    geometry.setAttribute("aRandom", new THREE.BufferAttribute(randoms, 1));
    geometry.setAttribute("aSize", new THREE.BufferAttribute(sizes, 1));
    return { geometry, points: pts, clusterB: clusterBPts, colorsArr: colors, randoms };
}

// Decides which hubs are linked, based on their clustered (target) positions.
// The topology stays fixed; only the rendered endpoint coordinates animate.
function buildLinkTopology(points, maxDist, maxLinksPerNode) {
    const pairs = [];
    for (let i = 0; i < points.length; i++) {
        let links = 0;
        for (let j = i + 1; j < points.length && links < maxLinksPerNode; j++) {
            if (points[i].distanceTo(points[j]) < maxDist) {
                pairs.push([i, j]);
                links++;
            }
        }
    }
    return pairs;
}

// Each link becomes a screen-space "fat line" quad (4 vertices / 2 triangles)
// so its rendered width can be animated in the vertex shader.
function buildLinkGeometry(hubData, pairs) {
    const segCount = pairs.length;
    const vertCount = segCount * 4;
    const positions = new Float32Array(vertCount * 3); // unused by the shader, kept for geometry validity
    const aStart = new Float32Array(vertCount * 3);
    const aEnd = new Float32Array(vertCount * 3);
    const aSide = new Float32Array(vertCount);
    const aEndpoint = new Float32Array(vertCount);
    const aColorStart = new Float32Array(vertCount * 3);
    const aColorEnd = new Float32Array(vertCount * 3);
    const aPhase = new Float32Array(vertCount);
    const indices = new Uint16Array(segCount * 6);

    const colors = hubData.colorsArr;
    const sides = [-1, 1, -1, 1];
    const endpoints = [0, 0, 1, 1];

    for (let k = 0; k < segCount; k++) {
        const [i, j] = pairs[k];
        const base = k * 4;
        const phase = Math.random() * Math.PI * 2;

        for (let v = 0; v < 4; v++) {
            const vi = base + v;
            aSide[vi] = sides[v];
            aEndpoint[vi] = endpoints[v];
            aPhase[vi] = phase;

            aColorStart[vi * 3] = colors[i * 3];
            aColorStart[vi * 3 + 1] = colors[i * 3 + 1];
            aColorStart[vi * 3 + 2] = colors[i * 3 + 2];

            aColorEnd[vi * 3] = colors[j * 3];
            aColorEnd[vi * 3 + 1] = colors[j * 3 + 1];
            aColorEnd[vi * 3 + 2] = colors[j * 3 + 2];
        }

        const i6 = k * 6;
        indices[i6] = base; indices[i6 + 1] = base + 1; indices[i6 + 2] = base + 2;
        indices[i6 + 3] = base + 2; indices[i6 + 4] = base + 1; indices[i6 + 5] = base + 3;
    }

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute("aStart", new THREE.BufferAttribute(aStart, 3));
    geometry.setAttribute("aEnd", new THREE.BufferAttribute(aEnd, 3));
    geometry.setAttribute("aSide", new THREE.BufferAttribute(aSide, 1));
    geometry.setAttribute("aEndpoint", new THREE.BufferAttribute(aEndpoint, 1));
    geometry.setAttribute("aColorStart", new THREE.BufferAttribute(aColorStart, 3));
    geometry.setAttribute("aColorEnd", new THREE.BufferAttribute(aColorEnd, 3));
    geometry.setAttribute("aPhase", new THREE.BufferAttribute(aPhase, 1));
    geometry.setIndex(new THREE.BufferAttribute(indices, 1));
    return geometry;
}

function buildPointVertexShader(phase) {
    return `
        attribute float aRandom;
        attribute float aSize;
        attribute vec3 aColor;
        attribute vec3 aClusterB;
        varying vec3 vColor;
        uniform float uTime;
        uniform float uPixelRatio;

        const float HOLD = ${HOLD_SECONDS.toFixed(1)};
        const float TRANS = ${TRANSITION_SECONDS.toFixed(1)};
        const float FORM_CYCLE = ${FORM_CYCLE.toFixed(1)};
        const float FORM_PHASE = ${phase.toFixed(3)};

        void main() {
            vColor = aColor;

            float local = mod(uTime + FORM_PHASE, FORM_CYCLE);
            float formProgress;
            if (local < HOLD) {
                formProgress = 1.0;
            } else if (local < HOLD + TRANS) {
                formProgress = 1.0 - smoothstep(0.0, 1.0, (local - HOLD) / TRANS);
            } else if (local < HOLD * 2.0 + TRANS) {
                formProgress = 0.0;
            } else {
                formProgress = smoothstep(0.0, 1.0, (local - (HOLD * 2.0 + TRANS)) / TRANS);
            }
            vec3 pos = mix(aClusterB, position, formProgress);

            pos.x += sin(uTime * 0.4 + aRandom * 6.2831) * 0.6;
            pos.y += cos(uTime * 0.35 + aRandom * 6.2831) * 0.6;
            pos.z += sin(uTime * 0.3 + aRandom * 3.14159) * 0.5;
            vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
            float pulse = 0.8 + 0.35 * sin(uTime * 1.6 + aRandom * 6.2831);
            gl_PointSize = aSize * pulse * uPixelRatio * (220.0 / -mvPosition.z);
            gl_Position = projectionMatrix * mvPosition;
        }
    `;
}

const POINT_FRAGMENT_SHADER = `
    varying vec3 vColor;
    void main() {
        vec2 uv = gl_PointCoord - vec2(0.5);
        float d = length(uv);
        float alpha = smoothstep(0.5, 0.0, d);
        alpha *= alpha;
        gl_FragColor = vec4(vColor, alpha);
    }
`;

function makePointMaterial(phase) {
    return new THREE.ShaderMaterial({
        uniforms: {
            uTime: { value: 0 },
            uPixelRatio: { value: Math.min(window.devicePixelRatio || 1, 2) },
        },
        vertexShader: buildPointVertexShader(phase),
        fragmentShader: POINT_FRAGMENT_SHADER,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
    });
}

// Screen-space "fat line" technique (as used by three.js's own Line2/LineMaterial),
// reimplemented directly here so a connection's on-screen width can be animated
// per-segment — plain THREE.LineSegments always renders at ~1px regardless of
// any linewidth setting.
const LINK_VERTEX_SHADER = `
    attribute vec3 aStart;
    attribute vec3 aEnd;
    attribute float aSide;
    attribute float aEndpoint;
    attribute vec3 aColorStart;
    attribute vec3 aColorEnd;
    attribute float aPhase;

    uniform float uTime;
    uniform vec2 uResolution;
    uniform float uPixelRatio;

    varying vec3 vColor;
    varying float vPulse;
    varying float vSide;

    void main() {
        vColor = mix(aColorStart, aColorEnd, aEndpoint);
        vSide = aSide;

        vec4 clipStart = projectionMatrix * modelViewMatrix * vec4(aStart, 1.0);
        vec4 clipEnd = projectionMatrix * modelViewMatrix * vec4(aEnd, 1.0);

        vec2 screenStart = clipStart.xy / clipStart.w * uResolution;
        vec2 screenEnd = clipEnd.xy / clipEnd.w * uResolution;

        vec2 dir = normalize(screenEnd - screenStart);
        vec2 normal = vec2(-dir.y, dir.x);

        // occasional sharp flare rather than a gentle wobble, phase-varied per link
        float pulse = 0.3 + 0.7 * pow(max(0.0, sin(uTime * 0.6 + aPhase)), 4.0);
        vPulse = pulse;

        float widthPx = mix(1.0, 6.5, pulse) * uPixelRatio;

        vec4 clip = mix(clipStart, clipEnd, aEndpoint);
        vec2 offset = normal * (widthPx / uResolution) * aSide * clip.w;
        clip.xy += offset;

        gl_Position = clip;
    }
`;

const LINK_FRAGMENT_SHADER = `
    varying vec3 vColor;
    varying float vPulse;
    varying float vSide;
    void main() {
        float edge = smoothstep(1.0, 0.0, abs(vSide));
        float alpha = (0.15 + 0.55 * vPulse) * edge;
        gl_FragColor = vec4(vColor, alpha);
    }
`;

function makeLinkMaterial(pixelRatio) {
    return new THREE.ShaderMaterial({
        uniforms: {
            uTime: { value: 0 },
            uResolution: { value: new THREE.Vector2(1, 1) },
            uPixelRatio: { value: pixelRatio },
        },
        vertexShader: LINK_VERTEX_SHADER,
        fragmentShader: LINK_FRAGMENT_SHADER,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        side: THREE.DoubleSide,
    });
}

function EmbeddingField() {
    const mountRef = useRef(null);

    useEffect(() => {
        const container = mountRef.current;
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x05010f, 0.012);

        const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);

        const camera = new THREE.PerspectiveCamera(
            55, window.innerWidth / window.innerHeight, 0.1, 500
        );
        camera.position.set(0, 0, 42);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setPixelRatio(pixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x05010f, 1);
        renderer.domElement.classList.add("embedding-canvas");
        container.appendChild(renderer.domElement);

        const group = new THREE.Group();
        scene.add(group);

        const dustGeometry = buildDust(3200);
        const dustMaterial = makePointMaterial(DUST_PHASE);
        const dust = new THREE.Points(dustGeometry, dustMaterial);
        dust.frustumCulled = false;
        group.add(dust);

        const hubData = buildHubs(70);
        const hubMaterial = makePointMaterial(HUB_PHASE);
        const hubs = new THREE.Points(hubData.geometry, hubMaterial);
        hubs.frustumCulled = false;
        group.add(hubs);

        const linkPairs = buildLinkTopology(hubData.points, 13, 4);
        const linkGeometry = buildLinkGeometry(hubData, linkPairs);
        const linkMaterial = makeLinkMaterial(pixelRatio);
        const links = new THREE.Mesh(linkGeometry, linkMaterial);
        links.frustumCulled = false;
        group.add(links);

        // Recomputed every frame so the connections track each hub's current
        // (formation A <-> formation B interpolated) position — see hubCurrentPosition().
        const hubCurrent = hubData.points.map(() => new THREE.Vector3());
        const startArray = linkGeometry.attributes.aStart.array;
        const endArray = linkGeometry.attributes.aEnd.array;

        const updateLinkPositions = (t) => {
            for (let i = 0; i < hubData.points.length; i++) {
                hubCurrentPosition(hubData, i, t, hubCurrent[i]);
            }
            for (let k = 0; k < linkPairs.length; k++) {
                const [i, j] = linkPairs[k];
                const p1 = hubCurrent[i];
                const p2 = hubCurrent[j];
                const base = k * 4;
                for (let v = 0; v < 4; v++) {
                    const vi = (base + v) * 3;
                    startArray[vi] = p1.x; startArray[vi + 1] = p1.y; startArray[vi + 2] = p1.z;
                    endArray[vi] = p2.x; endArray[vi + 1] = p2.y; endArray[vi + 2] = p2.z;
                }
            }
            linkGeometry.attributes.aStart.needsUpdate = true;
            linkGeometry.attributes.aEnd.needsUpdate = true;
        };

        const pointer = { x: 0, y: 0 };
        const onPointerMove = (e) => {
            pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
            pointer.y = (e.clientY / window.innerHeight) * 2 - 1;
        };
        window.addEventListener("pointermove", onPointerMove);

        const onResize = () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            linkMaterial.uniforms.uResolution.value.set(
                window.innerWidth * pixelRatio,
                window.innerHeight * pixelRatio
            );
        };
        onResize();
        window.addEventListener("resize", onResize);

        const clock = new THREE.Clock();
        let rafId;
        const animate = () => {
            const t = clock.getElapsedTime();
            dustMaterial.uniforms.uTime.value = t;
            hubMaterial.uniforms.uTime.value = t;
            linkMaterial.uniforms.uTime.value = t;
            updateLinkPositions(t);

            group.rotation.y = t * 0.035;
            group.rotation.x = Math.sin(t * 0.08) * 0.06;

            camera.position.x += (pointer.x * 6 - camera.position.x) * 0.02;
            camera.position.y += (-pointer.y * 4 - camera.position.y) * 0.02;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
            rafId = requestAnimationFrame(animate);
        };
        animate();

        return () => {
            cancelAnimationFrame(rafId);
            window.removeEventListener("resize", onResize);
            window.removeEventListener("pointermove", onPointerMove);
            container.removeChild(renderer.domElement);
            dustGeometry.dispose();
            hubData.geometry.dispose();
            linkGeometry.dispose();
            dustMaterial.dispose();
            hubMaterial.dispose();
            linkMaterial.dispose();
            renderer.dispose();
        };
    }, []);

    return <div ref={mountRef} style={{ position: "absolute", inset: 0 }} />;
}

function App() {
    return (
        <React.Fragment>
            <EmbeddingField />
            <div className="vignette" />
            <div className="overlay">
                <img className="wordmark-logo" src="/static/airembr.png" alt="a&middot;rembr" />
                <div className="subtitle">Local Embedder API</div>
            </div>
        </React.Fragment>
    );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
